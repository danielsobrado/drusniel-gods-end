    aoRadius: 1.4
    bloomStrength: 0.12
    bloomThreshold: 1.8
    saturation: 0.94
    vignette: 0.12
  vegetation:
    count: 3200
    radius: 95
    patchScale: 0.065
    backlight: 0.32
  camera:
    pitch: 0.12
    distanceInHeights: 2.3
    heightInHeights: 0.22
    targetInHeights: 0.58
    shoulderInHeights: 0.18
  motion:
    walkSpeedInHeights: 0.85
    runSpeedInHeights: 2.4
