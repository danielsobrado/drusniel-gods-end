  style:
    enabled: true
    grassRootBrightness: 0.9
    grassGradientPower: 2.6
    grassFill: 0.06
    grassBacklight: 0.85
    meadowPatchScale: 0.035
    groundTipMix: 0.12
    bladeWidthScale: 1.05
    bladeHeightScaleMin: 0.88
    bladeHeightScaleMax: 1.22
    bladeCurve: 0.045
    foliageFill: 0.28
    canopyShadow: '#286746'
    canopyLight: '#8cb75a'
    canopyTint: 0.9
    groundPath: '#b7a476'
  occlusion:
    enabled: true
    minTriangles: 256
    minOccluderArea: 0.002
    boundsPadding: 0.15
    pixelPadding: 2
    depthBias: 0.00002
    minSavedTriangles: 25000
    probeInterval: 30
  shadows:
    cascades: 1
    distance: 180
    mapSize: 2048
    intensity: 0.72
    radius: 4
  atmosphere:
    height: 14
    falloff: 0.045
    density: 0.001
  post:
    samples: 4
    aoStrength: 0.18
    aoRadius: 0.85
    bloomStrength: 0.09
    bloomThreshold: 2.1
    saturation: 1.04
    contrast: 1.12
    lift: [0.004, 0.006, 0.012]
    gain: [1.02, 1.0, 0.97]
    highlightDesaturation: 0.35
    vignette: 0.14
    grain: 0.012
    sharpness: 0.6
    # Quarter-resolution screen-space shafts. sourceRadius is the share of the
    # screen height around the sun that emits; snowStrength applies in snow
    # country, where the valley mist gives the light something to catch in.
    lightShafts: { samples: 32, decay: 0.965, strength: 1, snowStrength: 2.4, sourceRadius: 0.45 }
    depthOfField: { focalRange: 28, bokehScale: 1 }
    # Menu defaults; every entry is switchable at runtime from Scene settings.
    effects:
      taa: false
      bloom: true
      lightShafts: true
      depthOfField: false
      sharpen: false
      grain: true
      vignette: true
      tonemapper: aces
  vegetation:
    count: 3200
    radius: 95
    patchScale: 0.065
    backlight: 0.32
  camera:
    pitch: 0.12
    distanceInHeights: 2.3
    heightInHeights: 0.22
    targetInHeights: 0.58
    shoulderInHeights: 0.18
  motion:
    walkSpeedInHeights: 0.85
