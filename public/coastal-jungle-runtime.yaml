# Runtime-only integration for the authored coastal jungle pack.
biomes:
  coastalJungle:
    enabled: true
    asset: Assets/terrain/coastal-jungle/scenes/coastal_jungle_reference.glb
    collisionGroup: coastalJungle
    anisotropy: 8
    region:
      zStart: 250
      zEnd: 430
      inlandStart: 140
      inlandEnd: 270
      flipAcross: false
      flipAlong: false
    ecology:
      edgeFade: 18
      baseVegetationScale: 0.18
      suppressWorldTrees: true
    placement:
      groundOffset: 0.025
      pathOffset: 0.045
      vineAttachHeight: 8.5
      slopeSampleDistance: 2
      maxSlope: 0.75
      routeMaskMax: 0.08
      routeFloorRevealStart: 0.08
      routeFloorRevealDepth: 0.08
      riverClearance: 10
      boundsPadding: 1
    collider:
      tree: { radius: 0.52, height: 7.5 }
      background_tree: { radius: 0.48, height: 7.5 }
      palm: { radius: 0.38, height: 7 }
    shadowKinds: [tree, background_tree, palm]
    render:
      lodHysteresis: 0.06
    quality:
      performance:
        maxDistance: 260
        shadows: false
        density:
          grass: 0.08
          groundcover: 0.14
          fern: 0.30
          broadleaf: 0.38
          palm: 1
          tree: 1
          shrub: 0.30
          vine: 0.25
          climber: 0.30
          background_tree: 1
          split_leaf: 0.35
      balanced:
        maxDistance: 360
        shadows: false
        density:
          grass: 0.16
          groundcover: 0.25
          fern: 0.50
          broadleaf: 0.60
          palm: 1
          tree: 1
          shrub: 0.50
          vine: 0.45
          climber: 0.50
          background_tree: 1
          split_leaf: 0.60
      high:
        maxDistance: 500
        shadows: true
        density:
          grass: 0.25
          groundcover: 0.42
          fern: 0.72
          broadleaf: 0.80
          palm: 1
          tree: 1
          shrub: 0.72
          vine: 0.68
          climber: 0.70
          background_tree: 1
          split_leaf: 0.80
      ultra:
        maxDistance: 650
        shadows: true
        density:
          grass: 0.45
          groundcover: 0.65
          fern: 1
          broadleaf: 1
          palm: 1
          tree: 1
          shrub: 1
          vine: 1
          climber: 1
          background_tree: 1
          split_leaf: 1
