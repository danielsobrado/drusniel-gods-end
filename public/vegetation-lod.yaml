# Offline derivatives; broad grass clumps preserve cover without extending dense geometry.
vegetationLod:
  enabled: true
  assetPath: Assets/terrain/vegetation-lods/
trees:
  lod:
    # Two mesh stages only. Past Medium the eight-view impostor holds the silhouette
    # for two triangles, which reads better than a decimated canopy and costs less.
    distances: [35, 75]
    referenceHeight: 12
    maxHeightScale: 1.1
    blend: 0.15
    chunkSize: 500
grass:
  far:
    enabled: true
    chunkSize: 75
    density: 0.65
    width: 3.4
    height: 1.35
    transitionStart: 0.8
    fadeStart: 0.9
    distances: { performance: 300, balanced: 400, high: 500, ultra: 600 }
biomes:
  coastalJungle:
    lod:
      enabled: true
      chunkSize: 150
      plantDistances: { performance: 300, balanced: 400, high: 500, ultra: 600 }
      treeDistances: { performance: 600, balanced: 900, high: 1200, ultra: 1600 }
