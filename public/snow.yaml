# Snow appearance and interaction tuning.
ground:
  snow:
    enabled: true
    altitude:
      start: 84
      full: 132
    slope:
      start: 0.34
      full: 0.84
    wind:
      # Held well off the preset sun bearings: sastrugi streak along the wind,
      # and a sun raking straight down the ridges lights both flanks alike.
      angleDegrees: 150
      driftFrequency: 0.015
      crossFrequency: 0.027
      exposureFrequency: 0.009
      exposureCrossFrequency: 0.014
      warp: 2.6
      driftHeight: 22
      scourStrength: 14
    # Snowflow's analytic fine relief (lib/terrain.wgsl): ridged sastrugi
    # streaked along the wind, transverse ripples and grain, at Snowflow's
    # heights times detail.worldScale. Each entry scales one layer.
    relief:
      sastrugi: 1
      ripples: 1
      grain: 1
      # How strongly slopes facing into the wind count as scoured.
      windward: 0.6
      # Brightness lift on relief crests and darkening in troughs.
      toneContrast: 0.06
    colors:
      shadow: '#b3c2d3'
      base: '#e4eaf1'
      sun: '#f4f7fb'
      driftVariation: 0.06
    # Multiplies exposed rock colour across the snow altitude band.
    rockTint: '#9ea7b3'
    roughness:
      base: 0.7
      compressed: 0.4
      berm: 0.82
      variation: 0.06
    # Snowflow's subsurface lobe and cell glints; see src/world/snowShadingNodes.js.
    lighting:
      sssStrength: 0.12
      sssRadius: 1
      glintStrength: 0.9
      glintGrazing: 0.5
    # Regional light over snow country, blended in by the ground height under
    # the view: a low warm sun raking across the snow, a cool sky, snow bounce
    # instead of meadow bounce, and more haze. Relative to the active preset.
    atmosphere:
      enabled: true
      startHeight: 95
      fullHeight: 140
      fadeRate: 0.6
      snapDistance: 40
      sunElevationDegrees: 15
      sunIntensityScale: 1.7
      sunWarmth: '#fff0dc'
      hemisphereIntensityScale: 0.65
      ambientIntensityScale: 0.4
      environmentIntensityScale: 0.55
      skyTint: '#dce6ff'
      groundBounce: '#e6ecf3'
      sunBounce: 0.3
      ambientCooling: 0.8
      fogTint: '#eaf1ff'
      fogDesaturation: 0.6
      fogDensityScale: 1.6
      horizonDesaturation: 0.5
      zenithDesaturation: 0.45
      zenithHaze: 0.2
      exposureScale: 0.95
      # Screen-space AO on open snow is mostly the estimator's own bias.
      occlusionScale: 0.3
    # Snow007C detail maps (ambientCG, CC0). worldScale is world metres per
    # Snowflow metre, so its tiling and pixel-footprint fades match a 5 m rider.
    # Snow007C's normals are shallower than Snowflow's generated grain, hence a
    # strength above one.
    detail:
      worldScale: 2.78
      strength: 2.4
      cavity: 0.8
      colorVariation: 1
      roughnessVariation: 0.3
    textures:
      color: Assets/ground/snow/snow007c_color_1k.jpg
      normal: Assets/ground/snow/snow007c_normal_gl_1k.jpg
      packed: Assets/ground/snow/snow007c_ao_rough_height_1k.jpg
    deformation:
      enabled: true
      resolution: 512
      worldSize: 64
      paintMinCoverage: 0.35
      footRadiusScale: 1.6
      stampSpacingScale: 1.58
      minRadius: 0.16
      maxRadius: 0.56
      contactHeight: 0.75
      recenterDistance: 8
      depressionStrength: 0.95
      bermStrength: 0.55
      normalStrength: 1.3
      darkenStrength: 0.62
      bermLighten: 0.12
      decaySeconds: 120
      bermDecaySeconds: 55
      recoveryInterval: 0.2
    # Falling snow over snow-covered ground. Intensity follows the snow coverage
    # under the view, so it snows on the alpine summit and nowhere else.
    snowfall:
      enabled: true
      # Sized for this world's 5 m characters: flake sizes, the column and the
      # fall speed are the human-scale values times the body scale.
      count: 9000
      area: 70
      top: 45
      bottom: -10
      speed: 3.4
      sizeMin: 0.1
      sizeMax: 0.3
      swayRadius: 1.4
      swayFrequency: 0.6
      windSpeed: 3.2
      opacity: 0.95
      color: '#dae6f6'
      minCoverage: 0.2
      fullCoverage: 0.7
      maxIntensity: 1
      fadeRate: 1.2
      # Metres from the camera; flakes are gone below this and whole at three
      # times it, so none swells into a disc in front of the lens.
      nearFade: 4
      sampleDistance: 0.5
    powder:
      enabled: true
      capacity: 3000
      particlesPerContact: 18
      runningMultiplier: 1.5
      emitDistance: 0.12
      minCoverage: 0.25
      contactHeight: 0.6
      normalSampleDistance: 0.5
      spawnHeight: 0.06
      spread: 0.12
      lifetimeMin: 0.55
      lifetimeMax: 1.15
      sizeMin: 0.018
      sizeMax: 0.05
      sizeGrowth: 1.3
      fadeStart: 0.2
      horizontalSpeedMin: 0.35
      horizontalSpeedMax: 1.2
      verticalSpeedMin: 0.9
      verticalSpeedMax: 2.8
      drag: 5.2
      gravity: 9.81
      windSpeed: 3.2
      terminalFallSpeed: 1.9
      settleFadeMultiplier: 2.5
      settleHorizontalRetention: 0.2
      opacity: 0.66
      color: '#dcebf4'
      seed: 1337
      ambient:
        enabled: true
        particlesPerSecond: 72
        radius: 20
        minHeight: 0.05
        maxHeight: 0.85
        lifetimeMin: 1.15
        lifetimeMax: 2.4
        sizeMin: 0.02
        sizeMax: 0.065
        verticalSpeedMin: 0.03
        verticalSpeedMax: 0.18
    # Snow-surf wake: sprinting on snow sweeps a breaking wall of snow behind the
    # rider. Lengths and speeds are for a referenceHeight rider and scale with
    # the character.
    wake:
      enabled: true
      referenceHeight: 1.8
      capacity: 96
      spineStep: 0.3
      columns: 128
      rows: 18
      lifeSeconds: 0.88
      bowLead: 0.55
      maxHeight: 2.4
      minSpeed: 2.2
      fullSpeed: 4.3
      minCoverage: 0.35
      carveAcceleration: 26
      transmission: 1
      roughness: 0.8
      color: '#f3f6fb'
      spray:
        curtainPerMetre: 88
        driftPerMetre: 7
        maxPerFrame: 150
      shake:
        amplitude: 0.05
        loadThreshold: 0.25
        gain: 4
        decay: 1.2
      streaks:
        strength: 1
        startSpeedRatio: 0.6
        fullSpeedRatio: 2
