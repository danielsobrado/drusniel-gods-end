# Art direction and effect budgets. Loaded after the recovered visual settings.
terrain:
  heightResolution: 1536
  expansion:
    enabled: true
    size: 1600
    width: 2400
    depth: 1600
    center: [400, 0]
grass:
  heightResolution: 2048
collisions:
  worldBounds:
    - { position: [1570, 80, 0], size: [1, 500, 1540] }
    - { position: [400, 80, 770], size: [2340, 500, 1] }
    - { position: [400, 80, -770], size: [2340, 500, 1] }
    - { position: [-770, 80, 0], size: [1, 400, 1540] }
boundaryBarrier:
  enabled: true
  height: 12
  color: '#55e8ff'
  accentColor: '#a477ff'
  opacity: 0.32
  glowStrength: 8
  noiseScale: 0.035
  noiseSpeed: 0.035
  fresnelPower: 3
  proximityRadius: 16
cinematic:
  enabled: true
  exposure: 0.98
  style:
    enabled: true
    grassRootBrightness: 0.9
    grassGradientPower: 2.6
    grassFill: 0.06
    grassBacklight: 0.85
    meadowPatchScale: 0.035
    groundTipMix: 0.12
    bladeWidthScale: 1.05
    bladeHeightScaleMin: 0.88
    bladeHeightScaleMax: 1.22
    bladeCurve: 0.045
    foliageFill: 0.28
    canopyShadow: '#286746'
    canopyLight: '#8cb75a'
    canopyTint: 0.9
    groundPath: '#b7a476'
  occlusion:
    enabled: true
    minTriangles: 256
    minOccluderArea: 0.002
    boundsPadding: 0.15
    pixelPadding: 2
    depthBias: 0.00002
    minSavedTriangles: 25000
    probeInterval: 30
  shadows:
    cascades: 1
    distance: 180
    mapSize: 2048
    intensity: 0.72
    radius: 2.5
  atmosphere:
    height: 10
    falloff: 0.05
    density: 0.00065
  post:
    samples: 4
    aoStrength: 0.18
    aoRadius: 0.85
    bloomStrength: 0.09
    bloomThreshold: 2.1
    saturation: 1.02
    vignette: 0.045
  vegetation:
    count: 3200
    radius: 95
    patchScale: 0.065
    backlight: 0.32
  camera:
    pitch: 0.12
    distanceInHeights: 2.3
    heightInHeights: 0.22
    targetInHeights: 0.58
    shoulderInHeights: 0.18
  motion:
    walkSpeedInHeights: 0.85
    runSpeedInHeights: 2.4
    footPlacement: true
  water:
    reflectionInterval: 0.75
    reflectionDistance: 120
    reflectionResolution: 256
    planarReflectionScale: 0.75
  presentation:
    title: THE WILDS
    subtitle: A living landscape
ui:
  initialPreset: goldenHour
leaves:
  count: 240
  spawnInterval: 0.06
presets:
  sunny:
    lighting:
      color: '#fff5e7'
      directionalIntensity: 2.7
      hemisphereSkyColor: '#a8d0ed'
      hemisphereGroundColor: '#807258'
      hemisphereIntensity: 0.65
      ambientColor: '#d6e5ed'
      ambientIntensity: 0.24
      environmentIntensity: 0.48
    sky:
      horizonColor: '#b8d2df'
      zenithColor: '#467bac'
      sunHaloColor: '#fff4df'
      fogColor: '#a9c5d2'
      fogDensity: 0.0011
    cloudCoverage: 0.55
  rainy:
    lighting:
      directionalIntensity: 0.55
      ambientIntensity: 0.35
      environmentIntensity: 0.16
    sky:
      horizonColor: '#657e89'
      fogColor: '#617d88'
      fogDensity: 0.0035
  goldenHour:
    grass:
      blade: { baseColor: '#50852b', tipColor: '#a6bf65', sheen: 0.055 }
      billboard: { baseColor: '#50852b', tipColor: '#a6bf65', sheen: 0.055 }
    lighting:
      color: '#fff0c9'
      directionalIntensity: 2.8
      position: [-28, 65, -30]
      hemisphereSkyColor: '#b6def1'
      hemisphereGroundColor: '#78945d'
      hemisphereIntensity: 0.95
      ambientColor: '#dceac5'
      ambientIntensity: 0.32
      environmentIntensity: 0.65
    sky:
      horizonColor: '#c5e7df'
      zenithColor: '#438ec5'
      sunHaloColor: '#ffe8ad'
      sunPosition: [-28, 65, -30]
      fogColor: '#a5ced3'
      fogDensity: 0.0009
    cloudCoverage: 0.7
ground:
  metalness: 0
  macroVariation: 0.14
  normalStrength: 0.38
  normalY: -1
  wetness: 0.7
water:
  size: 640
  segments: 256
  sea:
    enabled: true
    level: -24
    shoreX: 1000
    depth: 95
    colors:
      sunny: { shallow: '#259eac', deep: '#073c58' }
      storm: { shallow: '#176662', deep: '#032d48' }
    offshoreAmplitude: 1.2
    beachAmplitude: 0.25
    choppiness: 4
    transitionStart: 30
    transitionEnd: 180
  river:
    enabled: true
    # World X, Z and full channel width; elevations follow the mountain profile.
    points:
      - [15, -650, 7]
      - [65, -555, 9]
      - [105, -455, 11]
      - [65, -355, 12]
      - [25, -255, 10]
      - [15, -165, 9]
      - [45, -105, 8]
      - [72, -76, 9]
      - [65, -38, 10]
      - [103, -8, 11]
      - [128, 22, 12]
      - [142, 53, 14]
      - [171, 80, 18]
      - [202, 97, 26]
  metalness: 0
  roughness: 0.24
  speed: 1.1
  waveHeight: 0.15
  reflectionStrength: 0.45
  fresnelPower: 4
  deepColor: '#18677d'
  surfaceColor: '#5dbbb1'
  sunStrength: 0.45
