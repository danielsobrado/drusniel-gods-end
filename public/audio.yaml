# Ambient beds, one-shots and footsteps. Files are built by
# `npm run audio:build` (scripts/build-audio.mjs); see
# public/Assets/Audio/CATALOG.md for sources and licences.
#
# Region names come from src/weather/ambientRegions.js and are eased weights
# at the listener: meadow, sand (open beach), surf (sea in view), jungle,
# water (near the lake or river), lake, snow. A bed or one-shot group with
# `regions` is only heard in them; without `regions` it is heard everywhere.
# `excludeRegions` fades it out again inside other regions.
# `preset`/`presets` limit it to weather presets. Distances are world units
# (about 2.8 per metre, see world.scale).
audio:
  masterVolume: 1
  ambientVolume: 0.5
  environmentVolume: 1
  presetFadeDuration: 1.5
  regionInterval: 0.25        # seconds between region samples at the listener
  regionFadeRate: 1.2         # 1/s easing toward the sampled region weights
  transition: { sound: Assets/Audio/ui/transition.mp3, volume: 0.3 }

  # Seamless loops, fetched the first time they become audible.
  ambient:
    - { name: wind, sound: Assets/Audio/ambient/meadow-wind.mp3, volume: 0.55, regions: [meadow, sand], volumeVariation: 0.3, variationSpeed: 0.6 }
    - { name: alpineWind, sound: Assets/Audio/ambient/alpine-wind.mp3, volume: 0.9, regions: [snow], volumeVariation: 0.3, variationSpeed: 0.5 }
    - { name: sea, sound: Assets/Audio/ambient/sea-surf.mp3, volume: 1.1, regions: [surf], volumeVariation: 0.1, variationSpeed: 0.3 }
    - { name: jungleDay, sound: Assets/Audio/ambient/jungle-day.mp3, volume: 0.9, regions: [jungle], presets: [sunny, goldenHour, rainy, windy, calm, bowed] }
    - { name: jungleNight, sound: Assets/Audio/ambient/jungle-night.mp3, volume: 0.85, regions: [jungle], presets: [goldenHour, moonlight] }
    - { name: stream, sound: Assets/Audio/ambient/stream.mp3, volume: 0.7, regions: [water] }
    - { name: nightCrickets, sound: Assets/Audio/ambient/night-crickets.mp3, volume: 0.6, regions: [meadow, sand], preset: moonlight, volumeVariation: 0.15, variationSpeed: 0.5 }
    - { name: rain, sound: Assets/Audio/ambient/rain.mp3, volume: 0.9, preset: rainy, volumeVariation: 0.08, variationSpeed: 1 }

  # Positional calls around the listener, each group cycling its variations.
  # `delay` is the gap between calls at full region weight (longer at the
  # region's edge); `place: sea` puts calls `seaward` units out from the
  # waterline, within `along` units of the listener along the shore.
  oneShots:
    - name: meadowBirds
      regions: [meadow]
      presets: [sunny, goldenHour, windy, calm, bowed]
      sounds:
        - Assets/Audio/meadow/bird-01.mp3
        - Assets/Audio/meadow/bird-02.mp3
        - Assets/Audio/meadow/bird-03.mp3
        - Assets/Audio/meadow/bird-04.mp3
        - Assets/Audio/meadow/bird-05.mp3
      volume: [0.35, 0.6]
      delay: [1.5, 6]
      distance: [25, 110]
      height: [8, 35]
      refDistance: 20
      maxDistance: 300
      voices: 3
    - name: crows
      regions: [meadow]
      presets: [sunny, goldenHour, rainy, windy, calm, bowed]
      sounds: [Assets/Audio/meadow/crows-01.mp3]
      volume: [0.3, 0.45]
      delay: [30, 70]
      distance: [100, 250]
      height: [25, 80]
      refDistance: 40
      maxDistance: 500
      voices: 1
    - name: waves
      regions: [surf]
      sounds:
        - Assets/Audio/beach/wave-01.mp3
        - Assets/Audio/beach/wave-02.mp3
        - Assets/Audio/beach/wave-03.mp3
        - Assets/Audio/beach/wave-04.mp3
        - Assets/Audio/beach/wave-05.mp3
        - Assets/Audio/beach/wave-06.mp3
      volume: [0.5, 0.8]
      pitch: [0.85, 1.05]
      delay: [2.5, 6]
      place: sea
      seaward: [8, 30]
      along: 90
      height: [0, 0.5]
      refDistance: 35
      maxDistance: 450
      voices: 3
    - name: seagulls
      regions: [surf]
      presets: [sunny, goldenHour, windy, calm, bowed]
      sounds:
        - Assets/Audio/beach/seagull-01.mp3
        - Assets/Audio/beach/seagull-02.mp3
        - Assets/Audio/beach/seagull-03.mp3
        - Assets/Audio/beach/seagull-04.mp3
        - Assets/Audio/beach/seagull-05.mp3
        - Assets/Audio/beach/seagull-06.mp3
      volume: [0.35, 0.6]
      delay: [5, 14]
      place: sea
      seaward: [-60, 150]
      along: 180
      height: [20, 60]
      refDistance: 30
      maxDistance: 550
      voices: 2
    - name: jungleBirds
      regions: [jungle]
      presets: [sunny, goldenHour, windy, calm, bowed]
      sounds:
        - Assets/Audio/jungle/piha-01.mp3
        - Assets/Audio/jungle/piha-02.mp3
        - Assets/Audio/jungle/piha-03.mp3
        - Assets/Audio/jungle/parrot-01.mp3
        - Assets/Audio/jungle/parrot-02.mp3
        - Assets/Audio/jungle/parrot-03.mp3
        - Assets/Audio/jungle/parrot-04.mp3
      volume: [0.3, 0.6]
      delay: [3, 10]
      distance: [40, 150]
      height: [20, 70]
      refDistance: 30
      maxDistance: 400
    - name: cicadas
      regions: [jungle, sand]
      excludeRegions: [snow]
      presets: [sunny, goldenHour, calm]
      sounds:
        - Assets/Audio/jungle/cicada-01.mp3
        - Assets/Audio/jungle/cicada-02.mp3
      volume: [0.25, 0.4]
      delay: [12, 30]
      distance: [30, 90]
      height: [8, 25]
      refDistance: 25
      maxDistance: 250
      voices: 1
    - name: frogs
      regions: [water, jungle]
      excludeRegions: [snow]
      presets: [goldenHour, rainy, moonlight]
      sounds:
        - Assets/Audio/jungle/frog-01.mp3
        - Assets/Audio/jungle/frog-02.mp3
        - Assets/Audio/jungle/frog-03.mp3
      volume: [0.3, 0.5]
      delay: [2, 7]
      distance: [15, 80]
      height: [-2, 1]
      refDistance: 12
      maxDistance: 150

  # One file per contact. The surface under the foot comes from AudioRegions:
  # snow and sand by ground coverage, paths as gravel (mud in wetPresets),
  # bare rock above the snow line as gravel, the jungle floor as leaves.
  footsteps:
    preload: [grass]
    wetPresets: [rainy]
    grass:
      sounds:
        - Assets/Audio/footsteps/grass-01.mp3
        - Assets/Audio/footsteps/grass-02.mp3
        - Assets/Audio/footsteps/grass-03.mp3
        - Assets/Audio/footsteps/grass-04.mp3
        - Assets/Audio/footsteps/grass-05.mp3
        - Assets/Audio/footsteps/grass-06.mp3
        - Assets/Audio/footsteps/grass-07.mp3
        - Assets/Audio/footsteps/grass-08.mp3
      volume: 0.22
    sand:
      sounds:
        - Assets/Audio/footsteps/sand-01.mp3
        - Assets/Audio/footsteps/sand-02.mp3
        - Assets/Audio/footsteps/sand-03.mp3
        - Assets/Audio/footsteps/sand-04.mp3
        - Assets/Audio/footsteps/sand-05.mp3
        - Assets/Audio/footsteps/sand-06.mp3
      volume: 0.25
    snow:
      sounds:
        - Assets/Audio/footsteps/snow-01.mp3
        - Assets/Audio/footsteps/snow-02.mp3
        - Assets/Audio/footsteps/snow-03.mp3
        - Assets/Audio/footsteps/snow-04.mp3
        - Assets/Audio/footsteps/snow-05.mp3
        - Assets/Audio/footsteps/snow-06.mp3
        - Assets/Audio/footsteps/snow-07.mp3
        - Assets/Audio/footsteps/snow-08.mp3
      volume: 0.3
    leaves:
      sounds:
        - Assets/Audio/footsteps/leaves-01.mp3
        - Assets/Audio/footsteps/leaves-02.mp3
        - Assets/Audio/footsteps/leaves-03.mp3
        - Assets/Audio/footsteps/leaves-04.mp3
        - Assets/Audio/footsteps/leaves-05.mp3
        - Assets/Audio/footsteps/leaves-06.mp3
      volume: 0.25
    gravel:
      sounds:
        - Assets/Audio/footsteps/gravel-01.mp3
        - Assets/Audio/footsteps/gravel-02.mp3
        - Assets/Audio/footsteps/gravel-03.mp3
        - Assets/Audio/footsteps/gravel-04.mp3
        - Assets/Audio/footsteps/gravel-05.mp3
        - Assets/Audio/footsteps/gravel-06.mp3
      volume: 0.25
    mud:
      sounds:
        - Assets/Audio/footsteps/mud-01.mp3
        - Assets/Audio/footsteps/mud-02.mp3
        - Assets/Audio/footsteps/mud-03.mp3
        - Assets/Audio/footsteps/mud-04.mp3
        - Assets/Audio/footsteps/mud-05.mp3
        - Assets/Audio/footsteps/mud-06.mp3
      volume: 0.3
    water:
      sounds:
        - Assets/Audio/footsteps/water-01.mp3
        - Assets/Audio/footsteps/water-02.mp3
        - Assets/Audio/footsteps/water-03.mp3
        - Assets/Audio/footsteps/water-04.mp3
        - Assets/Audio/footsteps/water-05.mp3
        - Assets/Audio/footsteps/water-06.mp3
      volume: 0.35
      proximityDistance: 100
    minPitch: 0.93
    maxPitch: 1.07
    volumeSpread: 0.12        # +/- share of level per step
    runGain: 1.3
    minStepInterval: 0.25
    footstepPredictionDistance: 2
    animation:
      walk:
        steps: [0.059880239520958084, 0.30538922155688625, 0.5508982035928144, 0.7964071856287425]
      run:
        steps: [0.32558139534883723, 0.813953488372093]

  # Per-preset bed levels, by ambient name. Every weather preset needs an entry.
  presets:
    sunny: { ambient: {} }
    goldenHour: { ambient: { wind: { volumeMultiplier: 0.8 }, jungleDay: { volumeMultiplier: 0.6 }, jungleNight: { volumeMultiplier: 0.5 } } }
    rainy: { ambient: { wind: { volumeMultiplier: 0.5 }, jungleDay: { volumeMultiplier: 0.35 } } }
    windy: { ambient: { wind: { volumeMultiplier: 1.6 }, alpineWind: { volumeMultiplier: 1.3 }, sea: { volumeMultiplier: 1.2 } } }
    calm: { ambient: { wind: { volumeMultiplier: 0.35 }, alpineWind: { volumeMultiplier: 0.6 }, sea: { volumeMultiplier: 0.8 } } }
    bowed: { ambient: { wind: { volumeMultiplier: 0.7 } } }
    moonlight: { ambient: { wind: { volumeMultiplier: 0.5 } } }
