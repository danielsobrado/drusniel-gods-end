# Cheap procedural surface detail (src/rendering/surfaceDetail.js). No
# textures are added: the terrain shader is at WebGPU's 16-texture limit, so
# everything here is maths or extra reads of textures it already binds.
# Every strength is a live uniform (__grassDemo surfaceDetail state), so an
# effect can be toned or switched off at runtime; 0 skips the heavier ones.
surfaceDetail:
  enabled: true
  rock:
    # Water and iron stains running down steep faces. width/length are the
    # stain's size across and down the face in metres.
    streaks: { strength: 0.35, width: 1.1, length: 24, ochre: 0.35 }
    # Bedding planes dip by `dip` (metres of rise per metre in x and z) and
    # fold by `warp` metres over 1 / warpScale metres.
    strata: { strength: 1, dip: [0.14, -0.08], warp: 2.5, warpScale: 0.006 }
    # Darken hollows and crevices, lighten ridges and edges. scale is the
    # curvature (1/m) that counts as full, step the sampling distance.
    curvature: { crevice: 0.4, edge: 0.25, scale: 0.08, step: 6 }
    # Snow (up in snow country) or moss on the small ledges of steep faces.
    ledges: { strength: 0.85, threshold: 0.6 }
    # Broad colour drift over far peaks, faded in over `range` metres.
    distance: { strength: 0.18, scale: 0.0025, range: [150, 600] }
    # Wet rock and weed at the sea's waterline, splashing up to `height` m.
    waterline: { strength: 0.6, height: 1.6 }
  # Height-based blending of rock over ground, snow over rock and sand over
  # grass: the higher surface wins through the transition. It fades back to
  # the plain soft blend over `distance` metres, where textures no longer
  # resolve (sharp edges there only trace smooth blobs).
  blend: { strength: 1, contrast: 1.6, width: 0.22, distance: [40, 110] }
  # Gravel in the hollows at cliff feet and down gullies; stones are drawn
  # within `distance` metres, `cell` metres apart.
  scree: { strength: 0.8, cell: 0.9, distance: 70 }
  # How far (metres) the sand's inland edge wanders, over 1 / scale metres.
  coastEdge: { warp: 7, scale: 0.035 }
  # A sparse scatter of stones in the beach sand: `strand` is the share of
  # cells holding one along the high-water line (strandHeight metres above the
  # sea), `density` in patches elsewhere. They never sit in the wash.
  pebbles: { strength: 1, cell: 0.34, density: 0.008, strand: 0.02, strandHeight: [0.7, 2.8], distance: 45 }
  # Tree bark: moss on the upper and shaded side, wet in rain, snow on upward
  # faces in snow country, per-tree tint, darkened base (baseHeight metres).
  bark: { moss: 0.7, wet: 0.8, snow: 0.8, tint: 0.12, base: 0.35, baseHeight: 1.2 }
  # Scattered stones (props): wet band at lake/sea level, dust on top faces.
  props: { waterline: 0.7, height: 1.2, dust: 0.35 }
  # Grass along path edges: drier, yellower tips, rising over `band` of the
  # path field's grass exclusion (the last blades before the path).
  pathFringe: { strength: 0.9, band: [0.02, 0.35], color: '#c2ad62' }
  # Beach debris meshes: per-stone tone spread, sand dusting on top faces,
  # and the height above the sea they stay wet to.
  beachScatter: { enabled: true, tone: 0.35, dust: 0.5, wetHeight: 1.4 }
