terrain:
  alpine:
    enabled: true
    center: [-25, -655]
    basinRadius: 82
    basinHeight: 154
    basinRelief: 8
    rimRadius: 155
    rimWidth: 48
    rimHeight: 72
    outerBlendStart: 215
    outerRadius: 275
    angularPeaks: 5
    angularVariation: 0.38
    angularPhase: 0.65
    detailScale: 0.015
    detailAmplitude: 7
    detailOctaves: 3
    seed: 9127
    refineRadius: 300
    refinePasses: 1
    # Eroded ridges and gullies, shallow couloirs down the flanks and a broken
    # crest, so the cirque reads as a massif of rock under snow rather than a
    # bowl. Rock bands (strata) are off: stepped around the peaks they read as
    # man-made terraces from the lowlands.
    landform:
      couloirs: { amplitude: 6, spacing: 24, meander: 0.7 }
      relief: { amplitude: 22, scale: 0.011, octaves: 3 }
      crest: { amplitude: 9, scale: 0.028 }
    treeLine: 108
    treeClearRadius: 320
    route:
      name: Alpine cirque
      width: 3.4
      walkable: true
      terrainWidth: 15
      maxGrade: 0.32
      # Where the route crosses the rim, the cut is a steep valley.
      cut: { floorWidth: 13, toe: 6, slope: 1.25, slopeVariation: 0.4, fillSlope: 0.9, meander: 12, roughness: 5 }
      points:
        - [-125, -590]
        - [-92, -618]
        - [-58, -642]
        - [-25, -655]
        - [-72, -702]
        - [-110, -742]
        - [-135, -765]
