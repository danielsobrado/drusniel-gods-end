# Final visual tuning layered after the recovered and biome-specific settings.
cinematic:
  style:
    grassRootBrightness: 0.5
    grassGradientPower: 2.35
    grassFill: 0.025
    grassBacklight: 1.05
    meadowPatchScale: 0.025
    meadowTintCool: [0.8, 0.98, 0.86]
    meadowTintWarm: [1.12, 1.02, 0.74]
    meadowDryPatchScale: 0.011
    meadowDryPatchStart: 0.56
    meadowDryPatchEnd: 0.84
    meadowDryStrength: 0.22
    meadowDryTint: '#777455'
    groundTipMix: 0.08
    bladeWidthScale: 1.15
    bladeHeightScaleMin: 0.72
    bladeHeightScaleMax: 1.3
    bladeCurve: 0.07
    foliageFill: 0.17
    dryRoot: '#4d5a2b'
    dryTip: '#8e9550'
    canopyShadow: '#23533b'
    canopyLight: '#779b58'
    canopyTint: 0.78
  post:
    aoStrength: 0.32
    aoRadius: 1.1
    saturation: 1.04

quality:
  balanced:
    blade:
      lod:
        high: { density: 3.1 }
        medium: { density: 1.8 }
  high:
    blade:
      lod:
        # medium mirrors high so the stem count survives the segmentation drop
        # at 16.8 m; only the blade's curvature is given up there.
        high: { density: 3.4 }
        medium: { density: 3.4 }
    billboard:
      lod:
        high: { density: 3.1 }
        medium: { density: 1.8 }
  ultra:
    blade:
      lod:
        high: { density: 4.3 }
        medium: { density: 4.3 }
    billboard:
      lod:
        high: { density: 4 }
        medium: { density: 2 }

vegetation:
  growthThreshold: 0.18
  trees:
    grassShadePenalty: 0.46
  density:
    base: 0.68
    moistureBoost: 0.23
    macroVariation: 0.5
    detailVariation: 0.18
    highlandPenalty: 0.14
  height:
    base: 0.14
    macroWeight: 0.52
    moistureWeight: 0.38
    minGrowth: 0.38
    maxGrowth: 1

foliage:
  wildGrass:
    candidatesPerCell: 9
    count: 1500
    minDensity: 0.16
    minGrowth: 0.2
    minScale: 0.7
    maxScale: 1.32
    stretch: 0.11
    quality:
      performance: { density: 0.26, radius: 0.48, shadows: false }
      balanced: { density: 0.45, radius: 0.7, shadows: false }
      high: { density: 0.7, radius: 0.9, shadows: false }
      ultra: { density: 0.88, radius: 1, shadows: false }

trees:
  appearance:
    retention: 0.92
    scaleVariation: 0.08
    brightnessVariation: 0.1
    greenVariation: 0.06
  billboard:
