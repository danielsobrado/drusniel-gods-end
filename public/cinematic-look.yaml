# Art direction and effect budgets. Loaded after the recovered visual settings.
terrain:
  heightResolution: 1536
  expansion:
    enabled: true
    size: 1600
    width: 2400
    depth: 1600
    center: [400, 0]
    routes:
      - name: Snow climb
        width: 5.5
        walkable: true
        terrainWidth: 30
        maxGrade: 0.24
        # The climb crosses the alpine rim far below its crest. The cut is a
        # terraced gorge, snow benches between rock risers, not a sheer slot.
        cut: { floorWidth: 14, toe: 6, slope: 1.8, slopeVariation: 0.3, fillSlope: 0.9, meander: 7, benchHeight: 11, benchFraction: 0.5, roughness: 2.5 }
        points: [[-80, -250], [-125, -350], [-60, -440], [-150, -490], [-160, -550], [-125, -590], [-80, -620], [-55, -655], [-15, -710]]
      - name: Meadow north beach road
        width: 5.5
        walkable: true
        terrainWidth: 26
        maxGrade: 0.16
        points: [[2, -5], [-40, 120], [-20, 260], [80, 420], [210, 520], [420, 550], [620, 500], [800, 420], [990, 320]]
      - name: Foothill south beach trail
        width: 4.8
        walkable: true
        terrainWidth: 24
        maxGrade: 0.2
        points: [[-80, -250], [80, -280], [250, -310], [430, -300], [600, -260], [750, -220], [850, -195], [900, -180]]
