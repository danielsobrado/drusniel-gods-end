# Final visual tuning layered after the base and biome-specific settings.
cinematic:
  style:
    grassRootBrightness: 0.32
    # Density cues: root shade reaching two thirds up the blade, a darker
    # sward floor and a per-blade value spread read as a deep canopy instead
    # of separate straps on a green carpet. Edge-on thickening fills more but
    # follows the view, so near blades swim while walking: left off.
    grassCanopyDepth: 0.65
    groundSwardShade: 0.55
    grassValueJitter: 0.35
    grassThicken: 0
    # LOD bands thin retiring stems at full height and widen the survivors
    # (up to 2x) instead of shrinking stems into a mowed-looking strip.
    grassLodThinning: 1
    grassLodCompensation: 1
    grassLodWidenMax: 2
    grassGradientPower: 2.35
    grassFill: 0.025
    grassBacklight: 1.05
    meadowPatchScale: 0.025
    meadowTintCool: [0.8, 0.98, 0.86]
    meadowTintWarm: [1.12, 1.02, 0.74]
    meadowDryPatchScale: 0.011
    meadowDryPatchStart: 0.56
    meadowDryPatchEnd: 0.84
    meadowDryStrength: 0.22
    meadowDryTint: '#777455'
    groundTipMix: 0.08
    bladeWidthScale: 1.15
    bladeHeightScaleMin: 0.72
    bladeHeightScaleMax: 1.3
    bladeCurve: 0.07
    foliageFill: 0.17
    dryRoot: '#4d5a2b'
    dryTip: '#8e9550'
    canopyShadow: '#23533b'
    canopyLight: '#779b58'
    canopyTint: 0.78
  post:
    aoStrength: 0.32
    aoRadius: 1.1
    saturation: 1.04
    depthOfField: { focalRange: 50, bokehScale: 0.52 }

quality:
  balanced:
    blade:
      lod:
        high: { density: 3.1 }
        medium: { density: 1.8 }
  high:
    blade:
      lod:
        # medium mirrors high so the stem count survives the segmentation drop
        # at 16.8 m; only the blade's curvature is given up there.
        high: { density: 3.4 }
        medium: { density: 3.4 }
    billboard:
      lod:
        high: { density: 3.1 }
        medium: { density: 1.8 }
  ultra:
    blade:
      lod:
        high: { density: 4.3 }
        medium: { density: 4.3 }
    billboard:
      lod:
        high: { density: 4 }
        medium: { density: 2 }

