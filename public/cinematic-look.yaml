# Art direction and effect budgets. Loaded after the recovered visual settings.
cinematic:
  enabled: true
  exposure: 0.95
  occlusion:
    enabled: true
    minTriangles: 256
    minOccluderArea: 0.002
    boundsPadding: 0.15
    pixelPadding: 2
    depthBias: 0.00002
